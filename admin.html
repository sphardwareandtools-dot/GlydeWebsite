<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin - GLYDE Products</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    /* small admin overrides */
    .admin-header{max-width:1200px;margin:20px auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
    .admin-main{max-width:1200px;margin:0 auto;padding:16px}
    .prod-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
    .prod-card{background:#fff;padding:12px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,0.06);color:#111}
    .form-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .form-row input,.form-row select,.form-row textarea{padding:8px;border-radius:6px;border:1px solid #ddd;min-width:0}
    .form-row textarea{width:100%;min-height:70px}
    .btn-ghost{background:transparent;border:1px solid #222;padding:8px 10px;border-radius:6px}
    pre.json-edit{background:#f7f7f7;padding:12px;border-radius:8px;overflow:auto;max-height:320px}
    .controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .notice{padding:8px 12px;border-radius:6px;background:#eef9ee;color:#0a6e2f;margin-top:10px}
  </style>
</head>
<body>
  <header class="admin-header">
    <h1>GLYDE Admin — Products</h1>
    <div>
      <button id="reloadBtn" class="btn">Reload products.json</button>
      <button id="exportBtn" class="btn btn-primary">Export JSON</button>
      <button id="zipBtn" class="btn btn-whatsapp">Download media scaffold (zip)</button>
    </div>
  </header>

  <main class="admin-main">
    <section>
      <h2>Existing products</h2>
      <div id="prodList" class="prod-list"></div>
    </section>

    <hr />

    <section>
      <h2 id="formTitle">Add / Edit product</h2>
      <form id="prodForm">
        <div class="form-row">
          <input id="p-id" placeholder="id (number)" type="number">
          <input id="p-name" placeholder="name">
          <input id="p-category" placeholder="category">
        </div>
        <div class="form-row">
          <input id="p-folder" placeholder="folder (media/e101)">
          <input id="p-media" placeholder="media filenames (comma separated)">
        </div>
        <div class="form-row">
          <input id="p-sizes" placeholder="sizes (comma separated)">
          <input id="p-colors" placeholder="colors (comma separated)">
        </div>
        <div class="form-row">
          <textarea id="p-description" placeholder="description"></textarea>
        </div>
        <div class="form-row">
          <textarea id="p-pricing" placeholder='pricing as JSON (example: {"7 Foot":{"White":95}})'></textarea>
        </div>
        <div class="controls">
          <button id="addBtn" type="button" class="btn btn-primary">Save / Add</button>
          <button id="deleteBtn" type="button" class="btn btn-ghost">Delete</button>
          <button id="loadJsonBtn" type="button" class="btn">Load into editor</button>
          <button id="clearBtn" type="button" class="btn">Clear</button>
        </div>
      </form>

      <div style="margin-top:18px">
        <h3>Raw JSON editor (read-only view of current product.json)</h3>
        <pre id="jsonView" class="json-edit">Loading…</pre>
      </div>

      <div id="notice" class="notice" style="display:none"></div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
